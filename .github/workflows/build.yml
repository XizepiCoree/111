name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: List built plugins
        run: Get-ChildItem -Path build -Recurse -Filter *.vst3 | Select-Object -ExpandProperty FullName

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ClannadKI-VST3
          path: build/*_artefacts/Release/VST3/
          if-no-files-found: error
